[title_info]
title = "Greenhouse gas concentration forcing for CMIP7 climate change projection experiments"
running_title = "GHG forcing for CMIP7 projection experiments"

# Each author's `contributions` are tags, which are turned into the author contributions statement
# (one sentence per tag, e.g. "ZN and MM acquired funding.").
# The tags, and the text each is written as, are `CONTRIBUTIONS`
